<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HirePilot — Configure Interview</title>
  <link rel="stylesheet" href="css/interview-setup.css?v=3">
</head>
<body>

  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">Hire<span class="brand-accent">Pilot</span></a>
      <ul class="nav-links">
        <li><a class="nav-link" href="dashboard.html">Dashboard</a></li>
        <li><a class="nav-link active" href="interview-setup.html">Practice</a></li>
        <li><a class="nav-link" href="history.html">History</a></li>
      </ul>
      <div class="nav-actions">
        <button class="btn btn-secondary" onclick="handleLogout()">Logout</button>
      </div>
    </div>
  </header>

  <main class="main-wrapper">
    <div class="card" style="max-width:680px; margin:2rem auto; padding:2.25rem;">
      <div class="section-header" style="text-align:center; margin-bottom:2rem;">
        <h1 style="font-size:1.6rem; font-weight:700;">Configure Your Interview</h1>
        <p style="color:var(--text-secondary); font-size:0.9rem; margin-top:0.25rem;">Choose your parameters before execution.</p>
      </div>

      <div id="auth-notice" class="error-message" style="display:none; margin-bottom:1.25rem;"></div>
      <div id="setup-notice" style="display:none; margin-bottom:1.25rem; padding:0.65rem 0.85rem; background:var(--primary-light); border:1px solid rgba(34,197,94,0.3); color:var(--primary); border-radius:var(--radius-sm); font-size:0.85rem; font-weight:500;"></div>

      <form onsubmit="handleStartInterview(event)">
        <!-- Target Job Role -->
        <div class="form-group">
          <label class="form-label">ROLE</label>
          <select id="role" class="form-control" required>
            <option value="Python Developer">Python Developer</option>
            <option value="Java Developer">Java Developer</option>
            <option value="Web Developer">Web Developer</option>
            <option value="Full Stack Developer">Full Stack Developer</option>
            <option value="Data Analyst">Data Analyst</option>
            <option value="Data Scientist">Data Scientist</option>
            <option value="Software Developer">Software Developer</option>
          </select>
        </div>

        <!-- Experience Level -->
        <div class="form-group">
          <label class="form-label">EXPERIENCE</label>
          <div class="options-grid">
            <label class="option-card selected" onclick="selectOptionCard(this, 'experience')">
              <input type="radio" name="experience" value="Fresher" checked>
              Fresher
            </label>
            <label class="option-card" onclick="selectOptionCard(this, 'experience')">
              <input type="radio" name="experience" value="1–2 Years">
              1–2 Years
            </label>
            <label class="option-card" onclick="selectOptionCard(this, 'experience')">
              <input type="radio" name="experience" value="3–5 Years">
              3–5 Years
            </label>
            <label class="option-card" onclick="selectOptionCard(this, 'experience')">
              <input type="radio" name="experience" value="5+ Years">
              5+ Years
            </label>
          </div>
        </div>

        <!-- Interview Type -->
        <div class="form-group">
          <label class="form-label">INTERVIEW TYPE</label>
          <div class="options-grid">
            <label class="option-card selected" onclick="selectOptionCard(this, 'type')">
              <input type="radio" name="type" value="Technical" checked>
              Technical
            </label>
            <label class="option-card" onclick="selectOptionCard(this, 'type')">
              <input type="radio" name="type" value="HR">
              HR
            </label>
            <label class="option-card" onclick="selectOptionCard(this, 'type')">
              <input type="radio" name="type" value="Behavioral">
              Behavioral
            </label>
            <label class="option-card" onclick="selectOptionCard(this, 'type')">
              <input type="radio" name="type" value="Mixed">
              Mixed
            </label>
          </div>
        </div>

        <!-- Difficulty & Questions Count -->
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:1.25rem;" class="form-group">
          <div>
            <label class="form-label">QUESTIONS</label>
            <select id="questions_count" class="form-control">
              <option value="5">5 Questions (Short)</option>
              <option value="10" selected>10 Questions (Standard)</option>
              <option value="15">15 Questions (Full)</option>
            </select>
          </div>
          <div>
            <label class="form-label">DIFFICULTY</label>
            <select id="difficulty" class="form-control">
              <option value="Easy">Easy</option>
              <option value="Medium" selected>Medium</option>
              <option value="Hard">Hard</option>
            </select>
          </div>
        </div>

        <!-- Estimated Duration Preview Box -->
        <div style="background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:0.85rem 1rem; margin-top:1.25rem; display:flex; justify-content:space-between; align-items:center;">
          <span class="font-mono" style="font-size:0.825rem; font-weight:600; color:var(--text-secondary); text-transform:uppercase;">Estimated Duration:</span>
          <span id="est-duration-tag" class="font-mono" style="font-size:1.05rem; font-weight:800; color:var(--primary);">30 minutes</span>
        </div>

        <button type="submit" id="btn-start" class="btn btn-primary btn-lg" style="width:100%; margin-top:1.25rem;">
          ▶ Run Interview
        </button>
      </form>
    </div>
  </main>

  <footer>
    <p>© 2026 HirePilot. All rights reserved.</p>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/interview-setup.js"></script>
</body>
</html>
