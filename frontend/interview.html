<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HirePilot — Live Interview</title>
  <link rel="stylesheet" href="css/interview.css?v=3">
</head>
<body>

  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">Hire<span class="brand-accent">Pilot</span></a>
    </div>
  </header>

  <main class="main-wrapper" style="max-width:860px;">
    <div id="timeout-banner" style="display:none; margin-bottom:1rem; padding:0.85rem; background:rgba(245, 158, 11, 0.12); border:1px solid var(--warning); color:var(--warning); border-radius:var(--radius-sm); font-weight:600; text-align:center;">
      ⏰ Time's up! Your interview has been submitted.
    </div>

    <div class="interview-header">
      <div>
        <span id="q-number-tag" class="badge badge-green font-mono">Question 1 of 10</span>
        <span id="q-type-tag" class="badge badge-cyan font-mono" style="margin-left:0.4rem;">TECHNICAL</span>
      </div>
      <div id="countdown-clock" class="countdown-clock font-mono">30:00</div>
    </div>

    <div class="question-card">
      <span class="font-mono" style="font-size:0.75rem; font-weight:700; color:var(--primary); text-transform:uppercase;">&gt; QUESTION</span>
      <h2 id="q-text" class="question-text">Booting question...</h2>
    </div>

    <div style="margin-bottom:1.5rem;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.5rem;">
        <label class="font-mono" style="font-weight:600; font-size:0.825rem; color:var(--text-main); letter-spacing:0.04em;">YOUR RESPONSE</label>
        <button type="button" id="mic-btn" class="mic-btn font-mono" onclick="toggleVoiceInput()">
          🎙️ Voice Input
        </button>
      </div>
      
      <textarea id="answer-input" class="answer-textarea" placeholder="Type your response here..."></textarea>
      
      <div style="display:flex; justify-content:flex-end; margin-top:0.4rem;">
        <span class="font-mono" style="font-size:0.75rem; color:var(--text-muted);">Tip: Clear, structured technical definitions score highest.</span>
      </div>
    </div>

    <div style="display:flex; justify-content:space-between; align-items:center; border-top:1px solid var(--border); padding-top:1.25rem;">
      <button id="btn-prev" class="btn btn-secondary" onclick="navigateQuestion(-1)">← Previous</button>
      <div style="display:flex; gap:0.75rem;">
        <button class="btn btn-secondary" onclick="skipQuestion()">Skip</button>
        <button id="btn-submit" class="btn btn-primary" onclick="submitAnswer()">Submit Answer →</button>
      </div>
    </div>
  </main>

  <footer>
    <p>© 2026 HirePilot. All rights reserved.</p>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/interview.js"></script>
</body>
</html>
