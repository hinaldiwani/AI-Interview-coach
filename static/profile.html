<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interview.exe — Developer Profile</title>
  <link rel="stylesheet" href="css/style.css?v=3.0">
  <link rel="stylesheet" href="css/auth.css?v=3.0">
</head>
<body>

  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">
        <div class="logo-icon">&gt;_</div>
        <span>Interview<span class="brand-exe">.exe</span></span>
      </a>
      <ul class="nav-links">
        <li><a class="nav-link" href="dashboard.html">Dashboard</a></li>
        <li><a class="nav-link" href="interview-setup.html">Practice</a></li>
        <li><a class="nav-link" href="history.html">History</a></li>
        <li><a class="nav-link active" href="profile.html">Profile</a></li>
      </ul>
      <div class="nav-actions">
        <button class="btn btn-secondary" onclick="handleLogout()">Logout</button>
      </div>
    </div>
  </header>

  <main class="main-wrapper">
    <div class="card" style="max-width:520px; margin:2.5rem auto; padding:2rem;">
      <div class="auth-header">
        <div class="font-mono" style="color:var(--primary); font-size:1.1rem; font-weight:700; margin-bottom:0.5rem;">&gt;_ Developer Profile</div>
        <h2>Developer Profile</h2>
        <p>Account credentials and execution details.</p>
      </div>

      <div class="form-group">
        <label class="form-label">FULL NAME</label>
        <input type="text" id="prof-name" class="form-control" readonly>
      </div>

      <div class="form-group">
        <label class="form-label">EMAIL ADDRESS</label>
        <input type="email" id="prof-email" class="form-control" readonly>
      </div>

      <div class="form-group">
        <label class="form-label">PROFILE CREATED</label>
        <input type="text" id="prof-created" class="form-control" readonly>
      </div>

      <div style="display:flex; justify-content:space-between; margin-top:2rem;">
        <a href="dashboard.html" class="btn btn-secondary">Go to Dashboard</a>
        <button class="btn btn-primary" onclick="handleLogout()">Logout Session</button>
      </div>
    </div>
  </main>

  <footer>
    <p>© 2026 Interview.exe — Run the interview. Debug your skills.</p>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      if (!ApiService.getAuthToken()) {
        sessionStorage.setItem("login_notice", "Please log in to view your developer profile.");
        sessionStorage.setItem("redirect_after_login", "profile.html");
        window.location.href = "login.html";
        return;
      }
      try {
        const profileData = await ApiService.getProfile();
        const u = profileData.user;
        document.getElementById("prof-name").value = u.name;
        document.getElementById("prof-email").value = u.email;
        document.getElementById("prof-created").value = new Date(u.created_at).toLocaleString();
      } catch (e) {
        console.error(e);
      }
    });
  </script>
</body>
</html>
