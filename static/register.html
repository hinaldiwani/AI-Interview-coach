<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interview.exe — Create Developer Profile</title>
  <link rel="stylesheet" href="css/style.css?v=3.0">
  <link rel="stylesheet" href="css/auth.css?v=3.0">
</head>
<body>

  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">
        <div class="logo-icon">&gt;_</div>
        <span>Interview<span class="brand-exe">.exe</span></span>
      </a>
      <ul class="nav-links">
        <li><a class="nav-link" href="index.html">Home</a></li>
        <li><a class="nav-link" href="login.html">Log In</a></li>
      </ul>
    </div>
  </header>

  <main class="main-wrapper">
    <div class="auth-container">
      <div class="auth-header">
        <div class="font-mono" style="color:var(--primary); font-size:1.1rem; font-weight:700; margin-bottom:0.5rem;">&gt;_ Interview.exe</div>
        <h2>Create your developer profile.</h2>
        <p>Let's get your interview environment ready.</p>
      </div>

      <form onsubmit="handleRegister(event)">
        <div class="form-group">
          <label class="form-label">FULL NAME</label>
          <input type="text" id="name" class="form-control" placeholder="John Doe" required>
        </div>
        <div class="form-group">
          <label class="form-label">EMAIL ADDRESS</label>
          <input type="email" id="email" class="form-control" placeholder="developer@example.com" required>
        </div>
        <div class="form-group">
          <label class="form-label">PASSWORD</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>
        <div class="form-group">
          <label class="form-label">CONFIRM PASSWORD</label>
          <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••" required>
        </div>

        <div id="error-msg" class="error-message"></div>

        <button type="submit" class="btn btn-primary" style="width:100%;">Create Profile →</button>
      </form>

      <p style="text-align:center; margin-top:1.5rem; color:var(--text-secondary); font-size:0.875rem;">
        Already registered? <a href="login.html" style="color:var(--primary); text-decoration:none; font-weight:600;">Log In here</a>
      </p>
    </div>
  </main>

  <footer>
    <p>© 2026 Interview.exe — Run the interview. Debug your skills.</p>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
